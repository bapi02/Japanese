name = "asiana-japan-fare"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# 배포한 웹 주소로 좁혀두는 걸 권장합니다. 예: "https://bapi02.github.io"
ALLOWED_ORIGIN = "*"
# test | production  (test 환경은 캐시된 샘플 데이터라 한국-일본 노선 결과가 거의 없습니다)
AMADEUS_ENV = "production"

# 아래 두 값은 vars 가 아니라 시크릿으로 넣으세요:
#   npx wrangler secret put AMADEUS_CLIENT_ID
#   npx wrangler secret put AMADEUS_CLIENT_SECRET
