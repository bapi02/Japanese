name: 항공권 시세 수집

on:
  schedule:
    # 매일 03:00 KST (18:00 UTC). GitHub 은 스케줄을 기본 브랜치에서만 실행합니다.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      dests:
        description: '조회할 목적지 (쉼표 구분, 예: NRT,HND,KIX,FUK)'
        required: false
        default: ''
      weeks:
        description: '앞으로 몇 주치 주말을 볼지'
        required: false
        default: ''
      cabins:
        description: '좌석등급 (ECONOMY / BUSINESS / ECONOMY,BUSINESS)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: flight-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 시세 수집
        env:
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_ENV: ${{ vars.AMADEUS_ENV || 'production' }}
          DESTS: ${{ github.event.inputs.dests || vars.FARE_DESTS || 'NRT,HND,KIX,FUK,NGO' }}
          WEEKS: ${{ github.event.inputs.weeks || vars.FARE_WEEKS || '6' }}
          CABINS: ${{ github.event.inputs.cabins || vars.FARE_CABINS || 'ECONOMY,BUSINESS' }}
          CONCURRENCY: '3'
        run: node flights/scripts/collect.mjs

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- flights/data/prices.json; then
            echo "가격 변동 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flights/data/prices.json
          git commit -m "chore(flights): 항공권 시세 갱신 ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push
